name: PASA Phase 1 Android Build

on:
  push:
    branches:
      - main
      - phase1-initial-setup

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PASA Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project structure
        run: |
          echo "=== PASA PROJECT STRUCTURE ==="
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Required project files found."

      - name: Verify Phase 1 restrictions
        run: |
          echo "=== CHECKING PHASE 1 RESTRICTIONS ==="

          if grep -R "POST_NOTIFICATIONS" app/src/main 2>/dev/null; then
            echo "ERROR: POST_NOTIFICATIONS permission detected."
            exit 1
          fi

          if grep -R "ACCESS_FINE_LOCATION\|ACCESS_COARSE_LOCATION" app/src/main 2>/dev/null; then
            echo "ERROR: Location permission detected."
            exit 1
          fi

          if grep -R "FOREGROUND_SERVICE" app/src/main 2>/dev/null; then
            echo "ERROR: Foreground service permission detected."
            exit 1
          fi

          echo "Phase 1 permission restrictions passed."

      - name: Check Gradle wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper is missing."
            echo "The project must contain gradlew and gradle/wrapper."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle wrapper properties are missing."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          echo "=== APK OUTPUT ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_COUNT=$(find app/build/outputs/apk -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated successfully."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PASA-Phase1-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build Gate Result
        run: |
          echo "========================================"
          echo " PASA PHASE 1 BUILD GATE"
          echo "========================================"
          echo "BUILD STATUS: VERIFIED"
          echo "APK STATUS: GENERATED"
          echo "PHASE 2 GATE: READY FOR REVIEW"
          echo "========================================"
